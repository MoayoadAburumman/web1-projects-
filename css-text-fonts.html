<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Text & Fonts</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f3f4f6; }
        .navbar { background-color: #2c3e50; overflow: visible; display: flex; direction: ltr; padding-left: 10px; }
        .navbar a, .dropdown .dropbtn { display: inline-block; color: white; text-align: center; padding: 14px 20px; text-decoration: none; font-size: 16px; font-weight: bold; border: none; outline: none; background-color: inherit; cursor: pointer; transition: 0.3s; }
        .navbar a:hover, .dropdown:hover .dropbtn { background-color: #34495e; color: #3498db; }
        .dropdown { position: relative; display: inline-block; }
        .dropdown-content { display: none; position: absolute; background-color: #34495e; min-width: 260px; box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; }
        .dropdown-content a { color: white; padding: 12px 16px; text-decoration: none; display: block; text-align: left; border-bottom: 1px solid #2c3e50; }
        .dropdown-content a:hover { background-color: #3498db; color: white; }
        .dropdown:hover .dropdown-content { display: block; }
        .content { padding: 40px; max-width: 1000px; margin: 0 auto; background-color: white; min-height: 80vh; box-shadow: 0 0 10px rgba(0,0,0,0.05); margin-top: 20px; border-radius: 8px; }
        .lesson-section { display: none; }
        .lesson-section.active-lesson { display: block; }
        code { background-color: #f8f9fa; padding: 2px 6px; }
        .demo-box { border: 1px solid #ccc; padding: 15px; margin-top: 15px; background-color: #fff; border-radius: 4px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 15px; margin: 5px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        button:hover { background-color: #2980b9; }

        /* Demo Custom Styles */
        .text-center-demo { text-align: center; text-transform: uppercase; color: #2c3e50; }
        .font-serif-demo { font-family: "Times New Roman", Times, serif; font-size: 20px; font-style: italic; }
        .link-custom-demo:link { color: #e74c3c; text-decoration: none; }
        .link-custom-demo:hover { color: #2ecc71; text-decoration: underline; font-weight: bold; }
        .list-custom-demo { list-style-type: square; }
    </style>
</head>
